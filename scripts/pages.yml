# Baut die Website und veroeffentlicht sie auf GitHub Pages.
# Laeuft nur bei Aenderungen auf main (also erst nach einem Merge) oder per Hand.
# Einmalig noetig: Repository -> Settings -> Pages -> Source: "GitHub Actions".
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Website-Daten erzeugen und gegen die Datenbank prüfen
        run: python ../scripts/build_data.py
      - name: Tests
        run: |
          python -m unittest ../scripts/test_build_data.py
          npm ci
          npm test
      - name: Website bauen
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
